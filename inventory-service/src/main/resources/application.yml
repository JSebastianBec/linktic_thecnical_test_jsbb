server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/linktic_db
    username: app_user
    password: changeme
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

security:
  api-key: ${SECURITY_API_KEY:local-dev-key}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8080}
    api-key: ${PRODUCT_SERVICE_API_KEY:local-dev-key}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
