name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  product-service:
    name: Build & Test — product-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        working-directory: product-service
        run: ./gradlew build jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: product-service-coverage
          path: product-service/build/reports/jacoco/

  inventory-service:
    name: Build & Test — inventory-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        working-directory: inventory-service
        run: ./gradlew build jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: inventory-service-coverage
          path: inventory-service/build/reports/jacoco/
